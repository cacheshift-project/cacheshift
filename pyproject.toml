[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheshift"
version = "0.1.0"
description = "A semantic-cache and model-router gateway that measures how the cache shifts the router's cost and answer quality."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.1", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "openai>=2,<3", "python-dotenv>=1,<2", "numpy>=1.26,<3"]
api = ["openai>=2,<3", "python-dotenv>=1,<2"]
evaluation = ["numpy>=1.26,<3"]
data = ["pyarrow>=18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
